
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerar Pix - PushinPay</title>
</head>
<body>
    <h1>Gerar Pagamento via Pix</h1>
    <form method="post" action="/gerar">
        <label>Valor (R$):</label>
        <input type="number" step="0.01" name="valor" required>
        <br><br>
        <button type="submit">Gerar QR Code</button>
    </form>

    {% if emv %}
        <h2>Pix copia e cola:</h2>
        <textarea rows="4" cols="60">{{ emv }}</textarea>
        <h2>QR Code:</h2>
        <img src="data:image/png;base64,{{ qr_image }}">
    {% endif %}
</body>
</html>
